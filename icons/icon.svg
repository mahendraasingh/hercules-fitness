<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="100%" stop-color="#0d1117" />
    </radialGradient>
  </defs>
  <!-- Background plate -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  
  <!-- Contribution Grid (Halloween Orange Palette) -->
  <g transform="translate(18, 18)">
    <!-- Row 0 -->
    <rect x="0"  y="0"  width="18" height="18" rx="4" fill="#161B22" stroke="rgba(255,255,255,0.06)"/>
    <rect x="24" y="0"  width="18" height="18" rx="4" fill="#4A210F"/>
    <rect x="48" y="0"  width="18" height="18" rx="4" fill="#D96B16"/>
    <rect x="72" y="0"  width="18" height="18" rx="4" fill="#8C3B0D"/>

    <!-- Row 1 -->
    <rect x="0"  y="24" width="18" height="18" rx="4" fill="#4A210F"/>
    <rect x="24" y="24" width="18" height="18" rx="4" fill="#FF9A3C"/>
    <rect x="48" y="24" width="18" height="18" rx="4" fill="#FF9A3C"/>
    <rect x="72" y="24" width="18" height="18" rx="4" fill="#D96B16"/>

    <!-- Row 2 -->
    <rect x="0"  y="48" width="18" height="18" rx="4" fill="#D96B16"/>
    <rect x="24" y="48" width="18" height="18" rx="4" fill="#FF9A3C"/>
    <rect x="48" y="48" width="18" height="18" rx="4" fill="#8C3B0D"/>
    <rect x="72" y="48" width="18" height="18" rx="4" fill="#FF9A3C"/>

    <!-- Row 3 -->
    <rect x="0"  y="72" width="18" height="18" rx="4" fill="#8C3B0D"/>
    <rect x="24" y="72" width="18" height="18" rx="4" fill="#D96B16"/>
    <rect x="48" y="72" width="18" height="18" rx="4" fill="#FF9A3C"/>
    <rect x="72" y="72" width="18" height="18" rx="4" fill="#4A210F"/>
  </g>
</svg>
